name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate
      # Validating needs no DigitalOcean token; applying it costs money, so
      # CI doesn't.
      - name: Validate the DigitalOcean example
        working-directory: examples/digitalocean
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      # circuit-hardening sets UMASK 027 in /etc/login.defs, which once left
      # Ollama's directories closed to the ollama user. The Circuit Builder
      # offers the two together, so every run hardens the host first, with
      # hardening's own example on its privileged host.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/circuit-hardening
          ref: v0.3.0
          path: hardening
          persist-credentials: false
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host and harden it
        working-directory: hardening/examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          CONTAINER_NAME: circuit-ollama
          PODMAN: sudo podman
        run: |
          ./up.sh
          conn3x init
          conn3x apply -auto-approve
          sudo podman exec circuit-ollama grep -qx 'UMASK 027' /etc/login.defs
          cp id_ed25519 id_ed25519.pub known_hosts "$GITHUB_WORKSPACE/examples/local/"
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # Asks the example's model for a reply through the API, and checks the
      # extra environment reached the service.
      - name: Check the model answers through the API
        run: |
          sudo podman exec -i circuit-ollama sh -eu <<'EOF'
          systemctl show ollama -p Environment | grep -q OLLAMA_KEEP_ALIVE=10m
          curl -sSf http://127.0.0.1:11434/api/generate \
            -d '{"model": "smollm2:135m", "prompt": "Say hello.", "stream": false}' |
            grep '"response":"[^"]'
          EOF
      # Changing the drop-in must restart Ollama with the new setting, which
      # needs systemd to reload first.
      - name: Change the environment, then check Ollama restarted with it
        working-directory: examples/local
        run: |
          conn3x apply -auto-approve -var keep_alive=20m
          conn3x plan -detailed-exitcode -var keep_alive=20m
          sudo podman exec -i circuit-ollama sh -eu <<'EOF'
          systemctl show ollama -p Environment | grep -q OLLAMA_KEEP_ALIVE=20m
          test "$(systemctl show ollama -p NeedDaemonReload --value)" = no
          started=$(date -d "$(systemctl show ollama -p ExecMainStartTimestamp --value)" +%s)
          test "$started" -ge "$(stat -c %Y /etc/systemd/system/ollama.service.d/conn3x.conf)"
          EOF
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh

